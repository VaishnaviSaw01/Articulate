services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: articulate
      POSTGRES_PASSWORD: articulate
      POSTGRES_DB: articulate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articulate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
